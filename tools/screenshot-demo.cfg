# Demo settings for README screenshots (tools\screenshots.ps1): made-up PCs,
# and its own port so the window's network scan doesn't list real ones.
name = "studio-pc"
port = 24901
role = "peer"
run_as_admin = true

[clipboard]
enabled = true
files = true

[security]
enabled = true
networks = ["192.168.50.0/24"]
allowed = ["laptop", "media-pc"]

[[peer]]
name = "laptop"
address = "192.168.50.21"
side = "left"
fingerprint = "3f9a51c27be04d6e8a1f0c93d5b7e2461c08f9ab37d2e5c4a6b18f0e92d7c3a5"
position = [-2560, 280]

[[peer.monitors]]
x = 0
y = 0
width = 2560
height = 1600
scale_percent = 150
primary = true
name = '\\.\DISPLAY1'

[[peer]]
name = "media-pc"
