[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
desklink-proto = { path = "crates/desklink-proto" }
desklink-win = { path = "crates/desklink-win" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
